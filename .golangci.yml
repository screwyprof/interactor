# https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - iface
    - ineffassign
    - interfacebloat
    - intrange
    - lll
    - maintidx
    - makezero
    - misspell
    - modernize
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - nolintlint
    - nonamedreturns
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - staticcheck
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    # require-doc covers what revive's `exported` rule would, which the `comments` exclusion preset
    # turns off: nothing else checks that an exported symbol has a doc comment.
    godoclint:
      enable:
        - require-doc
        - require-pkg-doc
        - require-stdlib-doclink
        - no-unused-link
    goconst:
      min-len: 2
      min-occurrences: 2
    gocyclo:
      min-complexity: 10
    govet:
      enable:
        - shadow
    lll:
      line-length: 120
      tab-width: 4
    nolintlint:
      allow-unused: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Exclude some linters from running on test files. goconst among them: a table case name
      # repeated across two tests is a fixture, not a constant waiting to be named.
      - linters:
          - dupl
          - err113
          - funlen
          - goconst
          - godoclint
          - gosec
        path: _test\.go
issues:
  # Only what this branch added, measured against where it left main. origin/main, not main: a CI
  # checkout has no local branch of that name, only remote-tracking refs. `make lint-all` clears it.
  new-from-merge-base: origin/main
formatters:
  enable:
    - gofumpt
    - gci
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/screwyprof)
    golines:
      max-len: 120
      tab-len: 4
  exclusions:
    generated: lax
