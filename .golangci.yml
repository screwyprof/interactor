# https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - dogsled
    - dupl
    - durationcheck
    - err113
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goheader
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - grouper
    - importas
    - ineffassign
    - interfacebloat
    - lll
    - maintidx
    - makezero
    - misspell
    - modernize
    - nakedret
    - nestif
    - nilerr
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    goconst:
      min-len: 2
      min-occurrences: 2
    gocyclo:
      min-complexity: 10
    govet:
      enable:
        - shadow
    lll:
      line-length: 120
      tab-width: 4
    nolintlint:
      allow-unused: false
    wrapcheck:
      # Substrings of signatures to ignore; overrides wrapcheck's default set.
      # See https://github.com/tomarrell/wrapcheck#configuration
      ignore-sigs:
        - fmt.Errorf(
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Exclude some linters from running on test files. goconst among them: a table case name
      # repeated across two tests is a fixture, not a constant waiting to be named.
      - linters:
          - dupl
          - err113
          - funlen
          - goconst
          - gosec
        path: _test\.go
      - linters:
          - wrapcheck
        path: testdsl/
issues:
  # Only what this branch added, measured against where it left main. origin/main, not main: a CI
  # checkout has no local branch of that name, only remote-tracking refs. `make lint-all` clears it.
  new-from-merge-base: origin/main
formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/screwyprof)
  exclusions:
    generated: lax
