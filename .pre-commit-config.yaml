# Hooks shell out to the Makefile, so the golangci-lint version is pinned in one place.
repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: format
        entry: make fmt
        language: system
        types: [go]
        pass_filenames: false

      - id: go-build
        name: go build
        entry: go build ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-lint
        name: golangci-lint
        entry: make lint
        language: system
        types: [go]
        pass_filenames: false

      - id: go-unit-tests
        name: go test
        entry: go test ./...
        language: system
        types: [go]
        pass_filenames: false
