# Hooks shell out to the Makefile, so every tool version is pinned in one place.
repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: format
        entry: make fmt
        language: system
        types: [go]
        pass_filenames: false

      - id: go-build
        name: go build
        entry: go build ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-lint
        name: golangci-lint
        entry: make lint
        language: system
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        files: (^go\.mod$|^go\.sum$|\.go$)
        pass_filenames: false
