name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # github-pr-check, the reporter the annotation step uses.
      checks: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # .golangci.yml diffs against origin/main, which needs real history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # `.x`, not go-version-file: setup-go would read go.mod's version as an exact patch and stay on it.
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      # Annotations on the diff. Never a gate, `make lint-all` below is. Skipped for forks, whose
      # token is read-only.
      - name: Lint annotations
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: make lint-annotate
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: make lint-all

      - name: Run tests
        run: make test

      - name: Upload coverage to Codecov
        if: '!cancelled() && hashFiles(''coverage.out'') != '''''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          files: ./coverage.out
          disable_search: true
          fail_ci_if_error: true
