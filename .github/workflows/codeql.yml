name: CodeQL

# Weekly as well as on changes, since new queries ship with CodeQL releases.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '36 19 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    # Same name the old matrix produced, so a required status check keeps matching.
    name: Analyze (go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Without it, autobuild uses whatever Go the runner image ships.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
